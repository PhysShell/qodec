finding_relay_coupling:
  id: user-role-is-not-human-authorship
  severity: high
  statement: >-
    In both windows the user role is mostly a transport channel. The human
    pastes the reviewer's text into the coder session and the coder's report
    into the reviewer session. A rule that grants human_confirmed by role would
    grant it to agent text.
  measured_coder_window:
    user_role_turns: 22
    system_notifications: 4
    relayed_reviewer_text: 14
    authored_directive: 1
    authored_ping: 3
  measured_reviewer_window:
    user_role_turns: 20
    relayed_coder_report: 16
    authored_directive: 1
    authored_ping: 2
    empty: 1
  consequences:
    - >-
      Authority must be assigned by authorship, not by role. A user-role turn
      whose body is pasted agent output is agent_claim from the other plane.
    - >-
      Agreement between the two chat planes is not independent corroboration.
      It is the same text, relayed. Only plane-record breaks the loop, which
      makes freezing it a precondition and not a nicety.
    - >-
      Genuine unmediated human authorship in the R21.0 arc is thin: one
      substantial directive and three status pings on the coder side, one
      directive and two pings on the reviewer side. Any oracle whose
      human_confirmed set is much larger than that is counting relays.
    - >-
      Selection is still signal. The human chose what to forward and what to
      drop, and the drops are visible as gaps between the planes. Model it as
      an authority of its own, weaker than authorship.
  suggested_authority_value: human_relayed

authority_rules:
  human_authored_turn:
    authority: human_confirmed
    condition: >-
      Platform-captured node, exact source pointer, and body not attributable to
      either agent plane.
  human_relayed_turn:
    authority: human_relayed
    note: >-
      Added in rev 2 on the strength of finding_relay_coupling. Records that a
      human chose to forward this text without asserting that a human wrote it.
  claude_code_assistant_statement:
    authority: agent_claim
  chatgpt_assistant_statement:
    authority: agent_claim
  embedded_tool_call:
    authority: tool_plumbing
    selected_into_state: false
  embedded_user_visible_tool_result:
    authority: platform_capture_or_corroborating_evidence
    caveat: may be truncated
  direct_git_commit_ci_log_json_artifact:
    authority: controller_or_repo_record
  deterministically_computed_digest_or_comparison:
    authority: deterministic_derivative

extractor_policy:
  include:
    - visible user text
    - visible assistant final text
    - user-visible tool results, separately typed
  exclude:
    - thoughts
    - reasoning_recap
    - hidden messages
    - tool invocation JSON
    - search plumbing
    - widget state
    - system messages
    - assistant preambles carrying no project state
  rule: >-
    Visible assistant conclusions are kept as agent_claim even where later
    confirmed. Being right does not raise authority after the fact.

required_freeze_plane_record:
  items:
    - commit records for 3ba3a38, 940c762, and every evidence head through 04108e7
    - topology evidence artifacts
    - baseline manifest
    - allowed-outcomes envelope
    - raw preservation stdout and stderr, with the digest record
    - actual and comparison JSON
    - associated CI runs, or an explicit recorded absence of CI on evidence heads
    - PR 16 metadata at cutoff
  storage: >-
    Canonical API responses stored in CAS. Live GitHub calls during replay are
    not acceptable: the API's answers drift, and a fixture that depends on them
    stops being a fixture.

gold_state_statement: >-
  gold-state-v0 is constructed from digest-bound extracted records under
  explicit authority and adjudication rules; every observation and relation is
  traceable to source records; independently reviewed before fixture lock.
rev1_retraction: >-
  Rev 1 said "derived mechanically from transcript + GitHub API". Extraction is
  mechanical. Deciding which claim is current, which is superseded, what
  relation binds two observations, and what counts as one atomic proposition is
  adjudication. The rev-1 phrasing would have let an adjudicated judgement enter
  the oracle wearing the authority of a computation.

expected_challenges:
  - superseded plans
  - agent claims contradicted by records
  - evidence branch versus product branch
  - relation closure
  - user-visible tool evidence
  - budget pressure
  - relay coupling between two agent planes

explicitly_absent:
  - id: verified-message-edit-topology
    detail: >-
      69 fork points exist in the coder transcript, 31 of them user and
      assistant sharing a parent. None is verified as a user editing a message.
      Interruption and queued input explain them equally well. If case-0002 must
      cover edit topology, neither plane supplies it.
  - id: cross-domain-generalization
    detail: >-
      Both chat planes are about proof infrastructure. A selector tuned here may
      look better than it is. At least one adversarial task from another domain
      before any generalisation claim.
  - id: holdout-authority
  - id: independent-human-record
    detail: >-
      No design document or issue tracker exists to cross-check human intent
      against. Combined with finding_relay_coupling, human_confirmed rests on a
      handful of authored turns.

