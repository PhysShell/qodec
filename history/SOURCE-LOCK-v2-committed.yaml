standing_risk:
  id: agent-is-the-subject
  severity: high
  statement: >-
    The coding agent is a participant in one of the three source planes. Several
    of its claims were false when made and were corrected later. If the same
    agent builds the gold state from its own account, the oracle becomes an
    agent reconstruction, which case-0002 forbids by name.
  required_mitigation:
    - >-
      Gold state built only from digest-bound extracted records, never from the
      agent's summaries.
    - >-
      Agent narration carries authority=agent_claim on both planes, including
      when it later turned out to be right. Correctness does not raise authority
      retroactively.
    - >-
      Every "current" claim traceable to a repository or controller record, or
      to an authored human turn, never to an assistant message.
    - >-
      A second party reviews the oracle before fixture lock.
  what_this_does_not_excuse: >-
    A fixture chosen because the agent looks good in it. Rev 1 rated two
    candidates down for exactly that reason and rev 2 keeps those ratings.

