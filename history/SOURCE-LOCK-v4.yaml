      This document cannot state the commit that contains it, and a lock that
      tried would be asserting a hash it could not have computed. The exact
      metadata head is therefore recorded outside: in the Round 0 fixture
      manifest or an acceptance receipt, alongside the digest of this file.

  v3_error_retracted: >-
    v3, MANIFEST and README told Round 0 to bind commit d4deceb and tree
    7fbe15bd. That tree contains the two gzip blobs and the first lock only. It
    holds no v3, no tools and no outputs, so naming it bound the data honestly
    and the metadata not at all: a fixture could have been built against those
    blobs with a different lock and a different pair of tools, and nothing in
    the binding would have noticed.

