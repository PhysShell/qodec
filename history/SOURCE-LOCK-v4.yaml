required_freeze_plane_record:
  items:
    - commit records for 3ba3a38, 940c762, and every evidence head through 04108e7
    - topology evidence artifacts
    - baseline manifest
    - allowed-outcomes envelope
    - raw preservation stdout and stderr, with the digest record
    - actual and comparison JSON
    - associated CI runs, or a frozen query that returned empty
    - PR 16 metadata at cutoff
  request_envelope:
    - endpoint
    - parameters
    - pagination
    - accept_header
    - api_version
    - retrieved_at
  response_envelope:
    - status
    - body_sha256
    - byte_length
    - page_count
  absence_rule: >-
    An absence is evidence only if the question that produced it is frozen too.
    "No CI on the evidence heads" must be stored as the exact query, its
    pagination, and an empty result with a digest. Absence without a recorded
    question is atmosphere.
  storage: >-
    Canonical responses in CAS. Live API calls during replay are not
    acceptable; the answers drift and a fixture that depends on them stops
    being a fixture.

