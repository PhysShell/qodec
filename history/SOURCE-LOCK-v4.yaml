# ---------------------------------------------------------------------------
authority_vocabulary:
  closed: true
  values:
    - platform_capture
    - deterministic_derivative
    - human_confirmed
    - controller_or_repo_record
    - agent_claim
  withdrawn:
    - id: human_relayed
      reason: >-
        The selector rejects observations on authority == agent_claim, so a new
        value beside it would have let relayed agent text into projection: the
        laundering the finding was raised to prevent.
    - id: platform_capture_or_corroborating_evidence
      reason: not a member, and it fused a captured occurrence with a corroborated fact

authority_rules:
  human_authored_turn:
    authority: human_confirmed
    condition: >-
      Platform-captured node, exact source pointer, body not attributable to
      either agent plane.
  relayed_agent_text:
    authority: agent_claim
    original_author: coder_agent | reviewer_agent
    transport:
      actor: human
      action: forwarded
      endorsement: not_implied
    note: >-
      Pasting is transport, not authorship. Text does not gain truth by passing
      through a clipboard.
  act_of_forwarding:
    modelled_as: a separate observation
    kind: evidence
    statement_shape: "Human forwarded claim X from plane A into plane B."
    authority: human_confirmed
    scope: >-
      human_confirmed attaches to the fact of forwarding and to nothing inside
      the forwarded text.
  claude_code_assistant_statement:
    authority: agent_claim
  chatgpt_assistant_statement:
    authority: agent_claim
  embedded_tool_call:
    selected_into_state: false
  captured_occurrence_of_tool_output:
    authority: platform_capture
  deterministic_parse_of_tool_output:
    authority: deterministic_derivative
  truncated_embedded_tool_result:
    authority: platform_capture
    claim_scope: only_the_captured_bytes
    cannot_establish: complete_external_state
  direct_frozen_git_or_pr_record:
    authority: controller_or_repo_record
  deterministically_computed_digest_or_comparison:
    authority: deterministic_derivative

extractor_policy:
  include:
    - visible user text
    - visible assistant final text
    - user-visible tool results, separately typed
  exclude:
    - thoughts
    - reasoning_recap
    - hidden messages
    - tool invocation JSON
    - search plumbing
    - widget state
    - system messages
    - assistant preambles carrying no project state
  rule: >-
    Visible assistant conclusions are kept as agent_claim even where later
    confirmed. Being right does not raise authority after the fact.

finding_relay_coupling:
  id: user-role-is-not-human-authorship
  severity: high
  status: stands; remedy corrected in v3 and unchanged here
  measured_coder_window:
    source: coder-profile.json
    user_role_turns: 22
    system_notification: 4
    relayed: 14
    authored_directive: 1
    authored_ping: 3
  measured_reviewer_window:
    authority: reviewer's measurement
    user_role_turns: 20
    relayed_coder_report: 16
    authored_directive: 1
    authored_ping: 2
    empty: 1
  consequences:
    - >-
      Agreement between the two chat planes is not independent corroboration.
      It is the same text, relayed. Only plane-record breaks the loop.
    - >-
      Genuine unmediated human authorship in the R21.0 arc is thin. Any oracle
      whose human_confirmed set is much larger is counting relays.

# ---------------------------------------------------------------------------
# Privacy: decided, and recorded as decided.
# ---------------------------------------------------------------------------
privacy_decision:
  status: ACCEPTED_RISK
  decision: keep_public_unredacted
  decided_by: controller
  decision_evidence: >-
    An explicit choice, made in the coder session after being shown the
    repository's public visibility, the presence of a personal email address,
    the scope and limits of the credential scan, and the fact that redaction
    voids every digest. Selecting byte-exact publication over three alternatives
    that included keeping the bytes private.
  acknowledged:
    - the repository is public
    - a personal email address is present in the logs
    - the pattern scan is limited to the patterns it searched for
    - the scan was run by the agent whose own output is in the logs
    - it has not been independently replayed
    - deletion cannot undo prior retrieval
  reviewer_position_on_record: >-
    Prefer a private CAS holding the bytes with only the digest manifest
    public, since a digest binds a private blob exactly as well as a public
    one. Publication is therefore not required by the freeze design. Recorded
    because a decision made against a stated objection should carry the
    objection with it.
  v3_inconsistency_corrected: >-
    v3 listed this as OPEN and as a Round 0 blocker while the decision had
    already been made. A decision cannot be reported as taken and as pending at
    once. It is a risk accepted by the controller, not an open question, and if
    the controller reverses it the status changes here first.

