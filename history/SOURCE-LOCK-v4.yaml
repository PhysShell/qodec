# ---------------------------------------------------------------------------
# Tools. Both now fail closed on unreadable input.
# ---------------------------------------------------------------------------
tooling_contract: >-
  The measurement contract is the output, versioned by the "tool" field the
  profiler emits. The implementation is the file, versioned by its own digest.
  The hardening below changes behaviour only on input the earlier
  implementation should never have accepted, so the contract is unchanged. That
  is not asserted: both hardened tools were run over the well-formed blobs and
  reproduced the recorded outputs byte for byte, so every count already
  published under the earlier implementation stands unaltered.

window_invariant:
  statement: >-
    The window blob is exactly the anchored slice of the prefix blob. Two blobs
    that are each individually well-formed do not establish the relation
    claimed between them, so the relation is computed rather than asserted.
  tool:
    id: o7.case0002.window-invariant/v0
    path: window_invariant.py
    bytes: 6688
    sha256: f1239b36225784410e3f550d08052e341545412626a8b614544566fda8ffbe1d
    supersedes_implementation:
      sha256: 009484934a021420dca748701e0ce1735f1fbba730a285ca0f62d01c2f362109
      defect: skipped malformed lines
  runtime: "CPython 3.11.15"
  checks:
    - every non-blank line of the prefix parses as a JSON object
    - every non-blank line of the window parses as a JSON object
    - each anchor uuid occurs exactly once in the prefix
    - the start anchor precedes the end anchor
    - the extracted slice contains exactly the expected number of records
    - the window blob itself contains exactly the expected number of records
    - the window blob's own digest matches the declared digest
    - the extracted slice is byte-identical to the window blob
  result:
    exit_code: 0
    problems: []
    byte_identical: true
    output: window-invariant.json
    output_sha256: 881f1b3b52a29bec58f03ba3d063e56608262b58b47b7cd83f5f7eba7fd0125b
    output_unchanged_from_previous_implementation: true

measurement_tool:
  id: o7.case0002.source-profiler/v0
  path: source_profiler.py
  bytes: 13070
  sha256: 2ca7a124a04a56d4d82c9d9e3e7015e28e884ab694d05cb3d8c3ac828ba75c77
  supersedes_implementation:
    sha256: 594695a59bbeaa24585a540194827738a88509638ef6cb2ca8931cb6bf22366c
    defect: skipped malformed lines
  runtime: "CPython 3.11.15"
  output_is_canonical: sorted keys, two-space indent, one trailing newline
  coder_run:
    command: >-
      python3 source_profiler.py --coder-window claude-session.window-r21.jsonl
    output: coder-profile.json
    output_sha256: 39fc8c24e340b57bcdff8f395a5c3002bd7f8e754ca05c43595b47c85e45e31c
    output_unchanged_from_previous_implementation: true
  reviewer_run:
    status: NOT RUN
    reason: the export is not present in this container
    command: >-
      python3 source_profiler.py --reviewer-export chatgpt-export.json
      --reviewer-start 264366ab-a59c-45e2-96e3-00b032cedeb1
      --reviewer-end d5b0a463-8a20-463d-9f3f-db9356710012
    expected_output_sha256: c46343a3dd9a82ec85b65df4b49ed45932cb8b9e7fe44155cfc6e95016c17dda
    expected_output_authority: reviewer, replaying this tool's algorithm
    on_mismatch: investigate; do not rewrite the expected digest
  relay_classifier_note: >-
    The relay rule is a heuristic: a task-notification prefix, then the anchor
    directive by uuid, then the reviewer plane's own rendering prefix, then a
    size threshold. The tool emits the per-turn table beside the totals so the
    classification can be re-checked line by line. It is not a reviewed mapping
    and must not be treated as one.

fail_closed_evidence:
  why: >-
    A parser that skips what it cannot read reports a count for a universe it
    silently edited. The count check cannot catch this, because the count comes
    from the same skipping parser.
  demonstration:
    fixture: >-
      One line replaced by unparseable text at the same position in both blobs,
      so the slice comparison cannot notice, and the expected record count set
      to the number the tool itself reports.
    previous_implementation:
      exit_code: 0
      reported: "extracted_records 526, byte_identical true, problems []"
      meaning: a corrupt pair of blobs passed every check
    hardened_implementation:
      exit_code: 1
      reported: "prefix line 16588 does not parse as JSON"
    also_observed: >-
      The previous profiler read the same fixture and reported records 526 with
      exit 0, having dropped the unreadable line without a word.
  negative_controls:
    - id: altered expected digest
      exit_code: 1
    - id: record count off by one
      exit_code: 1
    - id: anchors swapped
      exit_code: 1
    - id: malformed JSONL line
      exit_code: 1
      message_names_line: true
    - id: valid JSON scalar in place of a record
      exit_code: 1
      message_names_line: true
    - id: profiler on a malformed line
      exit_code: 1
    - id: profiler on a JSON scalar record
      exit_code: 1
  rationale: >-
    A check indistinguishable from its own absence is not a check.

