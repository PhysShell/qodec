# Interop Benchmark v2 — Nix-driven CI.
# Deterministic build + contract + smoke checks only. Performs no model calls
# and downloads no model or tokenizer weights during the execution phase.
#
# The committed flake.lock is mandatory: every job uses --no-update-lock-file so
# a run FAILS rather than silently relocking if evaluation tries to change it.
#
# Third-party actions are pinned to full immutable commit SHAs (never @main /
# @master / a floating tag). The trailing comment records the human-readable
# release for each pin. Verify the SHA against upstream before trusting a pin.
name: qodec-v2

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qodec-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Canonical, fixed execution environment (reproducibility).
env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TZ: UTC

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      # The provider-matrix block runs first, and deliberately so. It ends in a
      # clean-tree assertion over the whole checkout, and every step below it
      # writes into the checkout: `nix build` leaves a `result` symlink, the
      # staging steps create `panel-transcripts/` and `smoke-1x3x1/`. Run last,
      # the guard reported those seven entries and went red — correctly, and
      # uselessly, since none of them are the mutation harness's leavings.
      #
      # Deleting them before the check would be worse: a cleanup step can hide
      # exactly the leftovers the gate exists to notice. Ordering costs nothing
      # and keeps the assertion honest. These steps are pure Python — no
      # network, no key, no cargo — so nothing here needs the Nix steps first.
      #
      # The provider qualification canary decides what a `provider x model`
      # target has to demonstrate before a live run is allowed to mean
      # anything, and every classification is reachable from the stand-in
      # transport.
      - name: Provider qualification canary (model-free)
        run: python3 -m unittest discover -s evals/provider-matrix -p 'test_*.py' -t evals/provider-matrix
      # `unittest.main()` once sat above fourteen test classes, so the direct
      # invocation ran fewer than half of them and printed OK. CI uses
      # `-m unittest`, which imports first and is unaffected — so the hole was
      # invisible from the green side. This compares the test ids each
      # invocation actually reports, not a number written down somewhere.
      - name: Both ways of running the suite find the same tests
        run: python3 evals/provider-matrix/check_test_discovery.py
      # A green suite proves the tests pass, not that they would notice. Every
      # hardening contract is stated as its own negation here and must turn the
      # suite red. Run in a throwaway copy, so the checkout is never mutated —
      # the guard below then says so out loud rather than trusting it.
      - name: Provider canary mutation harness (model-free)
        run: python3 evals/provider-matrix/mutations.py
      # Not `git status --porcelain`, which prints what it finds and exits 0 —
      # the step that existed to prove the harness left nothing behind would
      # have stayed green while printing the mess. This asserts on output, over
      # the whole checkout, and `--self-test` proves it can say otherwise.
      - name: The clean-tree check can fail
        run: python3 evals/provider-matrix/check_clean_tree.py --self-test
      - name: The mutation harness left the tree byte-clean
        run: python3 evals/provider-matrix/check_clean_tree.py
      - name: Contract validator tests (model-free)
        run: nix build .#checks.x86_64-linux.qodec-v2-contract --no-update-lock-file --print-build-logs
      # Deliberately its own process, not a Rust test: the canonical identity
      # reference exists to disagree with the crate under test. Running it
      # inside that crate's test binary would let the two drift together, and
      # a reference nobody runs until someone remembers is discovered roughly
      # one fire too late.
      - name: Canonical identity cross-check against the independent reference
        run: python3 tests/reference/canon_reference.py --check
      # The Python cross-check above compares golden constants; it runs no Rust.
      # Until this step existed, no `cargo test` ran anywhere in CI, so the
      # contract suite could fail completely and leave the workflow green.
      - name: Rust test suite
        run: nix build .#checks.x86_64-linux.qodec-tests --no-update-lock-file --print-build-logs
      # Model-free rehearsal of the C1 forced-query arm: runs the dry-run driver
      # twice, compares byte-for-byte, checks the committed golden, validates the
      # transcript schema, and asserts the artifact never crosses the boundary.
      - name: Panel dry-run transcript (model-free)
        run: nix develop --command python3 evals/panel-dry-run/check.py
      # NOT under `result/`: earlier `nix build` steps leave that as a symlink
      # into the read-only store, so writing there fails with EACCES rather than
      # anything that reads like a real problem.
      - name: Stage panel transcripts
        if: always()
        run: |
          mkdir -p panel-transcripts
          nix develop --command cargo run -q --example panel_dry_run -- \
            --case happy \
            --jsonl-out panel-transcripts/happy.jsonl \
            --text-out panel-transcripts/happy.txt || true
          nix develop --command cargo run -q --example panel_dry_run -- \
            --case refusal \
            --jsonl-out panel-transcripts/refusal.jsonl \
            --text-out panel-transcripts/refusal.txt || true
      - name: Upload panel transcripts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: panel-dry-run-transcripts
          path: panel-transcripts/
          if-no-files-found: warn
      # The 1x3x1 smoke against the deterministic stand-in transport. Makes no
      # model call and needs no credentials: it exercises mapping, sealing,
      # delivery, normalization, the tool loop and both accounting planes, then
      # checks containment with a positive control so a wrong needle fails
      # loudly rather than passing forever. A live run is a deliberate act at a
      # human's command line and never happens here.
      - name: Smoke 1x3x1 (model-free stand-in)
        run: nix develop --command python3 evals/smoke-1x3x1/check.py
      - name: Stage smoke transcripts
        if: always()
        run: |
          mkdir -p smoke-1x3x1
          nix develop --command cargo run -q --example smoke_1x3x1 -- \
            --jsonl-out smoke-1x3x1/smoke.jsonl \
            --text-out smoke-1x3x1/smoke.txt || true
      - name: Upload smoke transcripts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: smoke-1x3x1-transcripts
          path: smoke-1x3x1/
          if-no-files-found: warn
      # The canary sends the crate's own schemas, not a paraphrase of them. If
      # the frozen artifact drifts from `panel::tool_schemas()`, the canary goes
      # on reporting PASS for a surface the arm no longer uses, and the receipt
      # looks exactly as convincing as before.
      - name: C1 panel surface has not drifted from the crate
        run: nix develop --command python3 evals/provider-matrix/check_surface.py
      # Round after round found the same defect in different clothes: the canary
      # accepting something the adapter will refuse. This asks the real
      # `serde_json` what it admits and requires the Python gate to admit
      # nothing more — one-directional, since refusing duplicate keys is a
      # deliberate extra strictness.
      - name: The JSON gate is no more liberal than the consumer
        run: nix develop --command python3 evals/provider-matrix/check_json_admission.py

  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      - name: Build qodec (explicit out-link)
        run: nix build .#qodec --out-link qodec-result --no-update-lock-file --print-build-logs
      - name: Build rtk-pinned (explicit out-link)
        run: nix build .#rtk-pinned --out-link rtk-result --no-update-lock-file --print-build-logs
      - name: Build + run real-RTK smoke (separate derivation)
        run: nix build .#checks.x86_64-linux.qodec-rtk-smoke --out-link smoke-result --no-update-lock-file --print-build-logs
      - name: Stage smoke report
        run: |
          test -f smoke-result/smoke/smoke-report.json
          mkdir -p smoke-report
          cp -rL smoke-result/smoke/. smoke-report/
      - name: Upload smoke report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: qodec-rtk-smoke-report
          path: smoke-report
          if-no-files-found: error

  flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      - name: Full flake check (committed lock, no relock)
        # Preserves the existing o7 / clippy / fmt checks alongside the new ones.
        run: nix flake check --no-update-lock-file --print-build-logs
