# case-0002 :: source blobs and the tools that bind them
# Every digest below was computed on the bytes shipped, in this branch.

authoritative_lock: SOURCE-LOCK-v5.yaml

counting_rule: >-
  No unattributed count enters the lock. A generated count names the frozen
  tool that produced it. An externally reproduced count names its producer and
  its verification status. Reviewer-plane counts are currently of the second
  kind and are labelled as such in the lock.

