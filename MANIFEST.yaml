identity:
  bind_to_objects_not_to_the_branch: true
  source_data_origin:
    commit: d4decebd5cebaf04920f9bd6f2a5eba26866a1ed
    tree: 7fbe15bdad41843b3f6a7647ecba4c8612ac02dc
    covers: the two gzip source blobs and nothing else
  metadata_bundle:
    covers: the authoritative lock, the tools, their outputs, the superseded locks
    binding: external_exact_head
    note: >-
      Naming the first commit binds the data and not the metadata. The exact
      metadata head must be recorded by the Round 0 manifest, outside these
      files, because a document cannot contain the hash of the commit that
      contains it.
  note: >-
    The branch ref is a locator and can move. Commit, tree and blob ids cannot.

append_only_property:
  claim: >-
    A digest over a record prefix of the coder session is stable; a digest over
    the whole file is not, because the session was still appending to it.
  evidence: >-
    The prefix was frozen at 02:07 UTC and recomputed at 02:34 UTC, after a
    container reset and after 31 further records had been appended. Byte length
    and sha256 reproduced exactly. Over the same interval the whole file moved
    from 87858714 bytes to 88002155.

verify:
  blobs: >-
    gunzip -c claude-session.prefix-r21.jsonl.gz | sha256sum
    gunzip -c claude-session.window-r21.jsonl.gz | sha256sum
  relation: >-
    python3 window_invariant.py --prefix <prefix> --window <window>
    --start-uuid 3a0760a5-e751-4ece-81e8-c9aea36a4ad4
    --end-uuid 3794550b-a82a-4f52-a785-9a599894d6ea
    --expect-records 527
    --expect-window-sha256 7b74dd3a521b7e999ef794450f1b0e15d563421a03cfa1ad499f8c7600adc023
  counts: >-
    python3 source_profiler.py --coder-window <window>

not_included:
  - id: plane-record
    detail: >-
      Repository, CI and evidence artifacts are still unfrozen and remain the
      blocking precondition for Round 0. Neither chat plane substitutes for it,
      and the two chat planes corroborate each other only because a human
      relayed the same text between them.
  - id: privacy-decision
    detail: >-
      Whether unredacted logs belong in a public repository is recorded as an
      open controller decision in SOURCE-LOCK-v3.yaml, not as settled.
