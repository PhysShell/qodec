append_only_property:
  claim: >-
    A digest over a record prefix of the coder session is stable; a digest over
    the whole file is not, because the session is still appending to it.
  evidence: >-
    The prefix through record 17111 was frozen at 02:07 UTC and recomputed at
    02:34 UTC, after a container reset and after 31 further records had been
    appended to the source file. Byte length 87564394 and sha256
    8392de803d600b19ac8273a43b2b766951d2eaf9a9197e1d8d43e97f541fca1c reproduced
    exactly. Over the same interval the whole file moved from 87858714 bytes to
    88002155.
  consequence: >-
    Bind the prefix. Anchors are uuids, not indices, so the binding survives any
    re-derivation of the index.

verify:
