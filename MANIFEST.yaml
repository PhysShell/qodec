tools:

  - name: window_invariant.py
    id: o7.case0002.window-invariant/v0
    proves: >-
      The window blob is byte-for-byte the anchored slice of the prefix blob.
    bytes: 6688
    sha256: f1239b36225784410e3f550d08052e341545412626a8b614544566fda8ffbe1d
    supersedes_implementation_sha256: 009484934a021420dca748701e0ce1735f1fbba730a285ca0f62d01c2f362109
    output: window-invariant.json
    output_sha256: 881f1b3b52a29bec58f03ba3d063e56608262b58b47b7cd83f5f7eba7fd0125b
    exit_code: 0
    fails_closed: >-
      Every non-blank line of both blobs must parse as a JSON object; the
      first that does not is refused with its line number.
    negative_controls: >-
      Altered digest, off-by-one record count, swapped anchors, malformed
      JSONL line, JSON scalar in place of a record. Each exits 1.

  - name: source_profiler.py
    id: o7.case0002.source-profiler/v0
    is: >-
      The frozen measurement filter. Counts it produced name it; counts it did
      not produce name whoever did.
    bytes: 13070
    sha256: 2ca7a124a04a56d4d82c9d9e3e7015e28e884ab694d05cb3d8c3ac828ba75c77
    supersedes_implementation_sha256: 594695a59bbeaa24585a540194827738a88509638ef6cb2ca8931cb6bf22366c
    output: coder-profile.json
    output_sha256: 39fc8c24e340b57bcdff8f395a5c3002bd7f8e754ca05c43595b47c85e45e31c
    fails_closed: >-
      Refuses the first non-blank line that is not a JSON object, naming it.
    reviewer_run: >-
      Performed, exit 0, against an export whose digest was checked first.
      Output reviewer-profile.json, sha256
      a770c3e63b7c7aff729c8c519ca6e3c2a3398402ed5357e952bf649c04b26289. Every
      measured value agrees with the reviewer's independent replay; the digest
      they expected belongs to a different report envelope and the disagreement
      is recorded in the lock rather than settled by editing either number.
    contract_unchanged_by_hardening: >-
      Both hardened tools reproduced the recorded outputs byte for byte over
      the well-formed blobs, so no published count moved.

