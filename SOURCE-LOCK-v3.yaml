# ---------------------------------------------------------------------------
# Executable relation between the two coder blobs
# ---------------------------------------------------------------------------
window_invariant:
  statement: >-
    The window blob is exactly the anchored slice of the prefix blob. Two blobs
    that are each individually well-formed do not establish the relation claimed
    between them, so the relation is computed rather than asserted.
  tool:
    id: o7.case0002.window-invariant/v0
    path: window_invariant.py
    bytes: 5323
    sha256: 009484934a021420dca748701e0ce1735f1fbba730a285ca0f62d01c2f362109
  runtime: "CPython 3.11.15"
  command: >-
    python3 window_invariant.py
    --prefix claude-session.prefix-r21.jsonl
    --window claude-session.window-r21.jsonl
    --start-uuid 3a0760a5-e751-4ece-81e8-c9aea36a4ad4
    --end-uuid 3794550b-a82a-4f52-a785-9a599894d6ea
    --expect-records 527
    --expect-window-sha256
    7b74dd3a521b7e999ef794450f1b0e15d563421a03cfa1ad499f8c7600adc023
  command_note: >-
    The tool echoes the anchors it was given into window-invariant.json, so the
    invocation recorded there is the authoritative one and this line can be
    checked against it.
  checks:
    - each anchor uuid occurs exactly once in the prefix
    - the start anchor precedes the end anchor
    - the extracted slice contains exactly 527 records
    - the window blob's own digest matches the declared digest
    - the extracted slice is byte-identical to the window blob
  result:
    exit_code: 0
    problems: []
    byte_identical: true
    output: window-invariant.json
    output_sha256: 881f1b3b52a29bec58f03ba3d063e56608262b58b47b7cd83f5f7eba7fd0125b
  negative_controls:
    - altered expected digest, exit 1
    - record count off by one, exit 1
    - anchors swapped, exit 1
  negative_control_rationale: >-
    A check indistinguishable from its own absence is not a check.

