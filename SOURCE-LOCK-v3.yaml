# ---------------------------------------------------------------------------
# Authority. The closed vocabulary is not extended.
# ---------------------------------------------------------------------------
authority_vocabulary:
  closed: true
  values:
    - platform_capture
    - deterministic_derivative
    - human_confirmed
    - controller_or_repo_record
    - agent_claim
  rev2_retraction:
    - id: human_relayed
      status: WITHDRAWN
      reason: >-
        Rev 2 proposed human_relayed as a new authority value. The selector
        makes an observation ineligible when authority equals agent_claim, so a
        new value sitting outside that test would have let relayed agent text
        into projection. That is precisely the laundering the finding was raised
        to prevent. The finding stands; the remedy was wrong.
    - id: platform_capture_or_corroborating_evidence
      status: WITHDRAWN
      reason: >-
        Not a member of the vocabulary, and it fused a captured occurrence with
        a corroborated fact. Decomposed below.

authority_rules:
  human_authored_turn:
    authority: human_confirmed
    condition: >-
      Platform-captured node, exact source pointer, body not attributable to
      either agent plane.
  relayed_agent_text:
    authority: agent_claim
    original_author: coder_agent | reviewer_agent
    transport:
      actor: human
      action: forwarded
      endorsement: not_implied
    note: >-
      Pasting is transport, not authorship. Text does not gain truth by passing
      through a clipboard.
  act_of_forwarding:
    modelled_as: a separate observation
    kind: evidence
    statement_shape: "Human forwarded claim X from plane A into plane B."
    authority: human_confirmed
    scope: >-
      human_confirmed attaches to the fact of forwarding and to nothing inside
      the forwarded text. An explicit written endorsement is a different
      observation, authored, and carries its own authority.
  claude_code_assistant_statement:
    authority: agent_claim
  chatgpt_assistant_statement:
    authority: agent_claim
  embedded_tool_call:
    selected_into_state: false
    note: plumbing, never state
  captured_occurrence_of_tool_output:
    authority: platform_capture
  deterministic_parse_of_tool_output:
    authority: deterministic_derivative
  truncated_embedded_tool_result:
    authority: platform_capture
    claim_scope: only_the_captured_bytes
    cannot_establish: complete_external_state
  direct_frozen_git_or_pr_record:
    authority: controller_or_repo_record
  deterministically_computed_digest_or_comparison:
    authority: deterministic_derivative

extractor_policy:
  include:
    - visible user text
    - visible assistant final text
    - user-visible tool results, separately typed
  exclude:
    - thoughts
    - reasoning_recap
    - hidden messages
    - tool invocation JSON
    - search plumbing
    - widget state
    - system messages
    - assistant preambles carrying no project state
  rule: >-
    Visible assistant conclusions are kept as agent_claim even where later
    confirmed. Being right does not raise authority after the fact.

# ---------------------------------------------------------------------------
finding_relay_coupling:
  id: user-role-is-not-human-authorship
  severity: high
  status: stands, remedy corrected in rev 3
  statement: >-
    In both windows the user role is mostly a transport channel. A rule that
    granted human_confirmed by role would grant it to agent text.
  measured_coder_window:
    source: coder-profile.json
    user_role_turns: 22
    system_notification: 4
    relayed: 14
    authored_directive: 1
    authored_ping: 3
  measured_reviewer_window:
    authority: reviewer's measurement, not re-derived here
    user_role_turns: 20
    relayed_coder_report: 16
    authored_directive: 1
    authored_ping: 2
    empty: 1
  consequences:
    - >-
      Agreement between the two chat planes is not independent corroboration.
      It is the same text, relayed. Only plane-record breaks the loop.
    - >-
      Genuine unmediated human authorship in the R21.0 arc is thin. Any oracle
      whose human_confirmed set is much larger is counting relays.
    - >-
      Selection is still signal, and it is modelled as act_of_forwarding above,
      never as an authority on the forwarded content.

# ---------------------------------------------------------------------------
# Unresolved: publication of unredacted logs
# ---------------------------------------------------------------------------
open_decision_privacy:
  id: public-unredacted-blobs
  status: OPEN, controller decision
  facts:
    - PhysShell/qodec is a public repository
    - the blobs are unredacted session logs, published byte-exact
    - they contain correspondence and one personal email address
    - >-
      a pattern scan for credentials found no matches (sk-, sk-ant-, ghp_,
      gho_, github_pat_, AKIA, xox*, PEM private key headers, and
      api_key-style assignments); the OAuth and proxy strings present are
      environment variable names without values
  scan_limits: >-
    A pattern scan proves the absence of the patterns it looked for and nothing
    else. It cannot establish that the logs contain no sensitive content, and it
    was run by the agent whose own output is in the logs. The reviewer could not
    replay it and does not confirm the no-secrets claim; the reviewer confirms
    only that GitHub stores immutable blobs of the stated sizes.
  reviewer_position: >-
    Prefer a private CAS holding the bytes with only the digest manifest public.
    A digest binds a private blob exactly as well as a public one, so
    publication is not required by the freeze design.
  controller_position: >-
    Publish byte-exact, decided after being shown the repository's public
    visibility, the personal address, and the fact that redaction voids every
    digest.
  note_on_reversal: >-
    Deleting the branch would not unpublish what has been fetched, and the
    objects may persist server-side. Reversal is a mitigation, not an undo, and
    it is the controller's call rather than the agent's.

# ---------------------------------------------------------------------------
required_freeze_plane_record:
  items:
    - commit records for 3ba3a38, 940c762, and every evidence head through 04108e7
    - topology evidence artifacts
    - baseline manifest
    - allowed-outcomes envelope
    - raw preservation stdout and stderr, with the digest record
    - actual and comparison JSON
    - associated CI runs, or a frozen query that returned empty
    - PR 16 metadata at cutoff
  request_envelope_required: true
  request_envelope:
    - endpoint
    - parameters
    - pagination
    - accept_header
    - api_version
    - retrieved_at
  response_envelope:
    - status
    - body_sha256
    - byte_length
    - page_count
  absence_rule: >-
    An absence is only evidence if the question that produced it is frozen too.
    "No CI on the evidence heads" must be stored as the exact query, its
    pagination, and an empty result with a digest. Absence without a recorded
    question is atmosphere.
  storage: >-
    Canonical responses in CAS. Live API calls during replay are not
    acceptable; the answers drift and a fixture that depends on them stops
    being a fixture.

