# case-0002 source lock, revision 3
#
# Rev 3 exists because two different documents were both called revision 2.
# It does not replace them quietly. Both are carried in this branch under
# history/ and both are bound by digest below.

meta:
  revision: 3
  produced_at: "2026-08-05T03:00:00Z"
  status: working artifact, not a fixture and not an implementation prompt
  measurement_rule: >-
    A number may appear in this document only if a frozen tool produced it, or
    if it is attributed to whoever did produce it. Numbers taken on someone
    else's authority say so and name them.

supersession:
  reason: >-
    Two non-identical revision-2 documents existed at the same time. One was
    delivered as an attachment; the other was committed to this branch after a
    container reset, reconstructed from context and shorter by 2198 bytes. The
    committed one silently lost whole_file_at_cutoff, the source provenance
    path, part of the measurement notes and the operational warning. Neither is
    wrong; they are simply not the same document, and a source lock that is
    both 13470 and 15668 bytes until observed is not a lock.
  supersedes:
    - id: attached-v2
      path: history/SOURCE-LOCK-v2-attached.yaml
      bytes: 15668
      sha256: 1f9e24c13987de7ea9d4cbdec3b1b75723b1c1430a97814eb9b87fe78bae9af4
      git_blob_sha1: 6e204bc74985dd733bd645a8211cba9fa77fb209
      recovery_note: >-
        Lost with the scratchpad, reconstructed, and confirmed byte-exact
        against the reviewer's independently recorded digest and blob id before
        being carried here.
    - id: committed-v2
      path: history/SOURCE-LOCK-v2-committed.yaml
      bytes: 13470
      sha256: 3e07a9d8fafc2c73fd2509da72096e75ab8c54b05197ab2941701cdb715192e0
      git_blob_sha1: 83c46fd5f3284c4f1c6ffd387c78a11600815cb4
      first_committed_in: d4decebd5cebaf04920f9bd6f2a5eba26866a1ed
    - id: rev-1
      name: case-0002-source-candidates.yaml
      status: not preserved in this branch
      retracted_for: invalid YAML, and an overclaim about mechanical derivation

